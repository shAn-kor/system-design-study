<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">서버 추가 삭제 시 안정 해시 데이터 이동</title>
  <desc id="desc">서버 추가 시 일부 구간만 새 서버로 이동하고 삭제 시 삭제 서버의 구간만 다음 서버로 이동하는 모습</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <style>
      .ring{fill:#f8fafc;stroke:#334155;stroke-width:4}
      .server{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}
      .new{fill:#dcfce7;stroke:#16a34a;stroke-width:3}
      .gone{fill:#fee2e2;stroke:#dc2626;stroke-width:3;stroke-dasharray:7 5}
      .range{fill:none;stroke:#f97316;stroke-width:14;stroke-linecap:round}
      .label{font-family:Arial,Apple SD Gothic Neo,sans-serif;font-size:21px;fill:#0f172a}
      .small{font-family:Arial,Apple SD Gothic Neo,sans-serif;font-size:15px;fill:#334155}
      .move{stroke:#dc2626;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1080" height="620" fill="#fff"/>
  <text x="40" y="46" class="label">서버 추가/삭제: 전체가 아니라 인접 구간만 이동</text>
  <g transform="translate(60,85)">
    <text x="0" y="0" class="label">1) S6 추가</text>
    <circle cx="230" cy="250" r="155" class="ring"/>
    <path d="M340 140 A155 155 0 0 1 382 240" class="range"/>
    <circle cx="230" cy="95" r="28" class="server"/><text x="216" y="102" class="small">S1</text>
    <circle cx="382" cy="218" r="28" class="server"/><text x="368" y="225" class="small">S2</text>
    <circle cx="326" cy="378" r="28" class="server"/><text x="312" y="385" class="small">S3</text>
    <circle cx="134" cy="378" r="28" class="server"/><text x="120" y="385" class="small">S4</text>
    <circle cx="78" cy="218" r="28" class="server"/><text x="64" y="225" class="small">S5</text>
    <circle cx="342" cy="138" r="28" class="new"/><text x="328" y="145" class="small">S6</text>
    <path d="M160 120 C210 65 300 70 330 115" class="move"/>
    <text x="28" y="455" class="small">S6 직전 구간의 key만 S6으로 이동</text>
  </g>
  <g transform="translate(570,85)">
    <text x="0" y="0" class="label">2) S3 삭제</text>
    <circle cx="230" cy="250" r="155" class="ring"/>
    <path d="M210 400 A155 155 0 0 1 94 332" class="range"/>
    <circle cx="230" cy="95" r="28" class="server"/><text x="216" y="102" class="small">S1</text>
    <circle cx="382" cy="218" r="28" class="server"/><text x="368" y="225" class="small">S2</text>
    <circle cx="326" cy="378" r="28" class="gone"/><text x="312" y="385" class="small">S3</text>
    <circle cx="134" cy="378" r="28" class="server"/><text x="120" y="385" class="small">S4</text>
    <circle cx="78" cy="218" r="28" class="server"/><text x="64" y="225" class="small">S5</text>
    <path d="M308 362 C250 382 190 392 154 382" class="move"/>
    <text x="20" y="455" class="small">S3이 맡던 key만 다음 서버 S4로 이동</text>
  </g>
</svg>
