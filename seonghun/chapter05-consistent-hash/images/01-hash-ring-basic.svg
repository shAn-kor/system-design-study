<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">안정 해시 기본 구조</title>
  <desc id="desc">해시 공간을 원형 링으로 만들고 서버와 데이터를 같은 링 위에 배치한 뒤 시계 방향으로 처음 만나는 서버에 저장하는 구조</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <style>
      .ring{fill:#f8fafc;stroke:#334155;stroke-width:5}
      .server{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}
      .key{fill:#fef3c7;stroke:#d97706;stroke-width:3}
      .label{font-family:Arial,Apple SD Gothic Neo,sans-serif;font-size:22px;fill:#0f172a}
      .small{font-family:Arial,Apple SD Gothic Neo,sans-serif;font-size:17px;fill:#334155}
      .arrow{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .hash{font-family:Arial,Apple SD Gothic Neo,sans-serif;font-size:18px;fill:#64748b}
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="40" y="48" class="label">안정 해시 기본 구조: 같은 해시 링 위에 서버와 데이터 배치</text>
  <circle cx="480" cy="300" r="180" class="ring"/>
  <path d="M660 300 A180 180 0 0 1 606 427" class="arrow"/>
  <text x="612" y="252" class="hash">시계 방향 탐색</text>
  <text x="456" y="102" class="hash">0</text>
  <text x="665" y="306" class="hash">2^m-1</text>
  <circle cx="480" cy="120" r="36" class="server"/>
  <text x="463" y="128" class="label">S1</text>
  <circle cx="651" cy="356" r="36" class="server"/>
  <text x="634" y="364" class="label">S2</text>
  <circle cx="309" cy="356" r="36" class="server"/>
  <text x="292" y="364" class="label">S3</text>
  <circle cx="394" cy="205" r="24" class="key"/>
  <text x="383" y="212" class="small">K1</text>
  <circle cx="590" cy="228" r="24" class="key"/>
  <text x="579" y="235" class="small">K2</text>
  <path d="M414 191 C438 168 456 145 471 132" class="arrow"/>
  <path d="M610 242 C637 270 652 306 653 330" class="arrow"/>
  <rect x="70" y="410" width="280" height="88" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="92" y="444" class="small">1. key와 server를 해시한다</text>
  <text x="92" y="474" class="small">2. 같은 링 위 위치로 보낸다</text>
  <rect x="610" y="410" width="280" height="88" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="632" y="444" class="small">3. key 위치에서 시계 방향 이동</text>
  <text x="632" y="474" class="small">4. 처음 만나는 server에 저장</text>
</svg>
